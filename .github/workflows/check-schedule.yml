name: Çanakkale Otobüs Saatleri Günlük Takip

on:
  schedule:
    # Günde 4 kez: Sabah 05:00, 11:00, 17:00, 22:00 (Türkiye saatiyle / UTC 02:00, 08:00, 14:00, 19:00)
    - cron: '0 2,8,14,19 * * *'
  workflow_dispatch: # GitHub web arayüzünden manuel "Run workflow" butonu

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Kur
        run: npm install

      - name: Belediye Sitesini Kontrol Et ve Saatleri Güncelle
        run: node check_updates.js

      - name: Değişiklik Varsa Kaydet ve Yayınla
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚨 Otomatik Güncelleme: Yeni Belediye Sefer Saatleri Eklendi [skip ci]" && git push)
