name: Çanakkale Otobüs Saatleri Günlük Takip

on:
  schedule:
    # Her gün sabah 06:00 ve 12:00'de (UTC) çalıştır
    - cron: '0 3,9 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Kur
        run: npm install

      - name: Belediye Sitesini Kontrol Et ve Güncelle
        run: node check_updates.js

      - name: Değişiklik Varsa Kaydet ve Yayınla
        run: |
          git config --global user.name 'Otobus-Bot'
          git config --global user.email 'bot@canakkale-ulasim.local'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚨 Otomatik Güncelleme: Yeni Sefer Saatleri Eklendi" && git push)
