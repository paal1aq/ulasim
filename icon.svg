<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Bus Body -->
  <rect x="110" y="110" width="292" height="280" rx="40" fill="url(#busGrad)" />
  
  <!-- Route Display Sign -->
  <rect x="186" y="130" width="140" height="26" rx="6" fill="#0f172a" />
  <text x="256" y="149" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80" text-anchor="middle">ÇANAKKALE</text>
  
  <!-- Windshield -->
  <rect x="136" y="170" width="240" height="96" rx="16" fill="#0f172a" />
  <!-- Windshield Divider -->
  <line x1="256" y1="170" x2="256" y2="266" stroke="#22c55e" stroke-width="6" />

  <!-- Headlights -->
  <circle cx="156" cy="326" r="22" fill="#fef08a" />
  <circle cx="156" cy="326" r="14" fill="#facc15" />
  <circle cx="356" cy="326" r="22" fill="#fef08a" />
  <circle cx="356" cy="326" r="14" fill="#facc15" />
  
  <!-- License Plate / Grill -->
  <rect x="216" y="320" width="80" height="20" rx="4" fill="#ffffff" />
  <text x="256" y="335" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">17 BEL 01</text>
  
  <!-- Wheels -->
  <rect x="136" y="380" width="46" height="34" rx="10" fill="#020617" />
  <rect x="330" y="380" width="46" height="34" rx="10" fill="#020617" />
</svg>
